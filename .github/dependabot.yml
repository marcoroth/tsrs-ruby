version: 2

updates:
  - package-ecosystem: cargo
    directory: "/rust"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Etc/UTC

    open-pull-requests-limit: 5

    groups:
      rust-minor-and-patch:
        update-types:
          - minor
          - patch

    # See .github/workflows/upstream.yml
    ignore:
      - dependency-name: "tsrs_*"
