[workspace]

[package]
name = "tsrs-ruby-ffi"
edition = "2021"
authors = ["Marco Roth <marco.roth@intergga.ch>"]
description = "C FFI bindings for tsrs, used by the tsrs gem"
license = "MIT"
repository = "https://github.com/marcoroth/tsrs-ruby"
publish = false

[lib]
name = "tsrs_ffi"
path = "src/lib.rs"
crate-type = ["cdylib", "staticlib", "rlib"]

# tsrs does not publish its crates, so they come from the release tag. See .github/workflows/upstream.yml.
[dependencies]
tsrs_api = { git = "https://github.com/oxc-project/tsrs", tag = "v0.18.0" }
tsrs_ast = { git = "https://github.com/oxc-project/tsrs", tag = "v0.18.0" }
tsrs_compiler = { git = "https://github.com/oxc-project/tsrs", tag = "v0.18.0" }
tsrs_contentmapper = { git = "https://github.com/oxc-project/tsrs", tag = "v0.18.0" }
tsrs_core = { git = "https://github.com/oxc-project/tsrs", tag = "v0.18.0" }
tsrs_execute = { git = "https://github.com/oxc-project/tsrs", tag = "v0.18.0" }
tsrs_project = { git = "https://github.com/oxc-project/tsrs", tag = "v0.18.0" }
tsrs_tsoptions = { git = "https://github.com/oxc-project/tsrs", tag = "v0.18.0" }
tsrs_vfs = { git = "https://github.com/oxc-project/tsrs", tag = "v0.18.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
cbindgen = "0.29"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "unwind"
