[workspace]

[package]
name = "tsrs-ruby-ffi"
edition = "2021"
authors = ["Marco Roth <marco.roth@intergga.ch>"]
description = "C FFI bindings for tsrs, used by the tsrs gem"
license = "MIT"
repository = "https://github.com/marcoroth/tsrs-ruby"
publish = false

[lib]
name = "tsrs_ffi"
path = "src/lib.rs"
crate-type = ["cdylib", "staticlib", "rlib"]

# Pinned to one tsrs release, which .github/workflows/upstream.yml keeps current.
[dependencies]
tsrs_api = "=7.1.0-beta.tsrs2"
tsrs_ast = "=7.1.0-beta.tsrs2"
tsrs_compiler = "=7.1.0-beta.tsrs2"
tsrs_contentmapper = "=7.1.0-beta.tsrs2"
tsrs_core = "=7.1.0-beta.tsrs2"
tsrs_execute = "=7.1.0-beta.tsrs2"
tsrs_project = "=7.1.0-beta.tsrs2"
tsrs_tsoptions = "=7.1.0-beta.tsrs2"
tsrs_vfs = "=7.1.0-beta.tsrs2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
cbindgen = "0.29"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "unwind"
